name: Temporary format Google backup tests after receipt update
on:
  push:
    branches:
      - agent/pm-google-3x3-drive-backup-20261122
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write scripts/check-google-apps-script.mjs scripts/check-linked-order-e2e.mjs
      - name: Commit formatting if needed
        shell: bash
        run: |
          if ! git diff --quiet -- scripts/check-google-apps-script.mjs scripts/check-linked-order-e2e.mjs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/check-google-apps-script.mjs scripts/check-linked-order-e2e.mjs
            git commit -m "style: format versioned Google receipt checks"
            git push origin HEAD:agent/pm-google-3x3-drive-backup-20261122
          fi
