name: Deploy to REG.RU

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://xn--80aaarctnodv3agc9d.xn--p1ai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js LTS
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Build public deployment artifact
        run: npm run build:deploy

      - name: Save deployment artifact
        uses: actions/upload-artifact@v7
        with:
          name: production-site-${{ github.sha }}
          path: _site/
          if-no-files-found: error
          retention-days: 14

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.HOST }}" >> ~/.ssh/known_hosts

      - name: Configure Telegram order notifications
        shell: bash
        env:
          PM_TELEGRAM_BOT_TOKEN: ${{ secrets.PM_TELEGRAM_BOT_TOKEN }}
          PM_TELEGRAM_CHAT_ID: ${{ secrets.PM_TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${PM_TELEGRAM_BOT_TOKEN}" ] || [ -z "${PM_TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram production secrets are not configured." >&2
            exit 1
          fi

          telegram_api="https://api.telegram.org/bot${PM_TELEGRAM_BOT_TOKEN}"
          curl --fail --silent --show-error \
            "${telegram_api}/getMe" | jq --exit-status '.ok == true' >/dev/null
          curl --fail --silent --show-error \
            --data-urlencode "chat_id=${PM_TELEGRAM_CHAT_ID}" \
            "${telegram_api}/getChat" | jq --exit-status '.ok == true' >/dev/null

          config_file="$(mktemp)"
          remote_stage=".pechataet-maksim-orders-${GITHUB_RUN_ID}.php"
          trap 'rm -f "${config_file}"' EXIT

          CONFIG_FILE="${config_file}" node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';

          const quotePhp = (value) =>
            `'${value.replaceAll('\\', '\\\\').replaceAll("'", "\\'")}'`;
          const token = process.env.PM_TELEGRAM_BOT_TOKEN;
          const chatId = process.env.PM_TELEGRAM_CHAT_ID;

          writeFileSync(
            process.env.CONFIG_FILE,
            `<?php

          return [
              'telegram' => [
                  'bot_token' => ${quotePhp(token)},
                  'chat_id' => ${quotePhp(chatId)},
              ],
          ];
          `,
            { mode: 0o600 },
          );
          NODE

          scp -q -i ~/.ssh/deploy_key "${config_file}" \
            "${{ secrets.USERNAME }}@${{ secrets.HOST }}:${remote_stage}"
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.USERNAME }}@${{ secrets.HOST }}" \
            "set -eu; \
              install -d -m 700 '/var/www/u2767403/data/www/private'; \
              install -m 600 '${remote_stage}' \
                '/var/www/u2767403/data/www/private/pechataet-maksim-orders.php'; \
              rm -f '${remote_stage}'"

      - name: Upload site to REG.RU
        shell: bash
        run: |
          rsync -az --delete-delay --delay-updates \
            --exclude='.well-known/' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./_site/ "${{ secrets.USERNAME }}@${{ secrets.HOST }}:/var/www/u2767403/data/www/xn--80aaarctnodv3agc9d.xn--p1ai/"

      - name: Verify production version and routes
        shell: bash
        env:
          PRODUCTION_URL: https://xn--80aaarctnodv3agc9d.xn--p1ai
        run: |
          version_json="$(
            curl --fail --location \
              --retry 6 --retry-delay 5 --retry-all-errors \
              "${PRODUCTION_URL}/version.json?commit=${GITHUB_SHA}"
          )"
          deployed_sha="$(
            VERSION_JSON="${version_json}" node -e \
              "process.stdout.write(JSON.parse(process.env.VERSION_JSON).commit)"
          )"

          if [ "${deployed_sha}" != "${GITHUB_SHA}" ]; then
            echo "Expected ${GITHUB_SHA}, received ${deployed_sha}" >&2
            exit 1
          fi

          curl --fail --location --retry 3 "${PRODUCTION_URL}/" >/dev/null
          curl --fail --location --retry 3 "${PRODUCTION_URL}/studio/" >/dev/null
          curl --fail --location --retry 3 "${PRODUCTION_URL}/robots.txt" >/dev/null
          curl --fail --location --retry 3 "${PRODUCTION_URL}/sitemap.xml" >/dev/null

          order_api_status="$(
            curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' \
              "${PRODUCTION_URL}/api/orders/"
          )"
          if [ "${order_api_status}" != "405" ]; then
            echo "Order API is not executing PHP: HTTP ${order_api_status}" >&2
            exit 1
          fi

          canonical_host="xn--80aaarctnodv3agc9d.xn--p1ai"
          canonical_target="https://${canonical_host}/studio/?redirect-check=1"

          while read -r source expected_redirects; do
            initial_status="$(
              curl --silent --show-error \
                --output /dev/null \
                --write-out '%{http_code}' \
                "${source}/studio/?redirect-check=1"
            )"
            expected_status="301"
            if [ "${expected_redirects}" = "0" ]; then
              expected_status="200"
            fi

            if [ "${initial_status}" != "${expected_status}" ]; then
              echo "Unexpected initial status for ${source}: ${initial_status}" >&2
              exit 1
            fi

            result="$(
              curl --silent --show-error --location --max-redirs 8 \
                --output /dev/null \
                --write-out '%{http_code} %{url_effective} %{num_redirects}' \
                "${source}/studio/?redirect-check=1"
            )"
            read -r status effective_url redirects <<<"${result}"
            normalized_url="$(
              EFFECTIVE_URL="${effective_url}" node -e \
                "process.stdout.write(new URL(process.env.EFFECTIVE_URL).href)"
            )"

            if [ "${status} ${normalized_url} ${redirects}" != \
              "200 ${canonical_target} ${expected_redirects}" ]; then
              echo "Unexpected redirect for ${source}: ${result}" >&2
              exit 1
            fi
          done <<EOF
          http://${canonical_host} 1
          https://${canonical_host} 0
          http://www.${canonical_host} 1
          https://www.${canonical_host} 1
          http://print86.ru 1
          https://print86.ru 1
          http://www.print86.ru 1
          https://www.print86.ru 1
          EOF

          for legacy_path in \
            constructor.html \
            ribbon-studio-design-system-v1.html
          do
            legacy_html="$(
              curl --fail --location --retry 3 \
                "${PRODUCTION_URL}/${legacy_path}"
            )"
            if ! grep -q 'url=/studio/' <<<"${legacy_html}"; then
              echo "Legacy path /${legacy_path} does not redirect to /studio/" >&2
              exit 1
            fi
          done

          for private_path in \
            docs/PROJECT_CONTEXT.md \
            tests/studio-content.spec.js
          do
            status="$(
              curl --location --silent --output /dev/null \
                --write-out '%{http_code}' \
                "${PRODUCTION_URL}/${private_path}"
            )"
            if [ "${status}" != "403" ] && [ "${status}" != "404" ]; then
              echo "Private path /${private_path} returned HTTP ${status}" >&2
              exit 1
            fi
          done
