name: Deploy to REG.RU

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://xn--80aaarctnodv3agc9d.xn--p1ai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js LTS
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Build public deployment artifact
        run: npm run build:deploy

      - name: Save deployment artifact
        uses: actions/upload-artifact@v7
        with:
          name: production-site-${{ github.sha }}
          path: _site/
          if-no-files-found: error
          retention-days: 14

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.HOST }}" >> ~/.ssh/known_hosts

      - name: Validate private Pricing 2.0 release bundle
        shell: bash
        env:
          PM_CALC_PRIVATE_BUNDLE_XZ_B64: ${{ secrets.PM_CALC_PRIVATE_BUNDLE_XZ_B64 }}
        run: |
          set -euo pipefail
          umask 077
          private_dir="${RUNNER_TEMP}/pm-calc-private-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 scripts/check-private-pricing-bundle.py "${private_dir}"

      # A quote release must fail BEFORE changing private config if the
      # deployed Google Web App is still the old 1+1-only version. GET has
      # no customer data or shared secret and returns schema metadata only.
      - name: Verify Google 3+3 backup schema before linked quote release
        if: ${{ vars.PM_QUOTE_BETA_GO_SHA == github.sha }}
        shell: bash
        env:
          PM_GOOGLE_WEBHOOK_URL: ${{ secrets.PM_GOOGLE_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PM_GOOGLE_WEBHOOK_URL:-}" ]; then
            echo "BLOCK: Google webhook is required for linked quote release" >&2
            exit 1
          fi
          # Never print the private Web App URL or any response body.
          provider_health="$(
            curl --fail --silent --location --retry 3 \
              --connect-timeout 5 --max-time 35 "${PM_GOOGLE_WEBHOOK_URL}"
          )" || { echo "BLOCK: Google backup health unavailable" >&2; exit 1; }
          PROVIDER_HEALTH="${provider_health}" node -e '
            let x;
            try { x = JSON.parse(process.env.PROVIDER_HEALTH); }
            catch { process.exit(2); }
            if (x.ok !== true || x.backupSchema !== "line-artworks-v2") {
              process.exit(3);
            }
            console.log("PASS: deployed Google Drive backup declares 3+3 schema");
          ' || { echo "BLOCK: Google Web App must be deployed with line-artworks-v2" >&2; exit 1; }

      - name: Install private Pricing 2.0 outside REG.RU document root
        shell: bash
        env:
          PM_QUOTE_BETA_GO_SHA: ${{ vars.PM_QUOTE_BETA_GO_SHA }}
        run: |
          set -euo pipefail
          remote_base='/var/www/u2767403/data/www/private'
          remote_stage="${remote_base}/.pm-calc-stage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          private_dir="${RUNNER_TEMP}/pm-calc-private-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          target='${{ secrets.USERNAME }}@${{ secrets.HOST }}'
          quote_release_mode=closed
          # Explicit GitHub Environment approval must match this exact commit.
          # An absent or stale approval keeps linked quotes off.
          if [ -n "${PM_QUOTE_BETA_GO_SHA:-}" ] && [ "${PM_QUOTE_BETA_GO_SHA}" = "${GITHUB_SHA}" ]; then
            quote_release_mode=enabled
          fi
          ssh -i ~/.ssh/deploy_key "${target}" \
            "set -eu; install -d -m 700 '${remote_base}'; \
             if [ -e '${remote_stage}' ]; then exit 51; fi; \
             install -d -m 700 '${remote_stage}'"
          rsync -az --chmod=D700,F600 \
            -e "ssh -i ~/.ssh/deploy_key" \
            "${private_dir}/" "${target}:${remote_stage}/"
          ssh -i ~/.ssh/deploy_key "${target}" \
            bash -s -- "${remote_stage}" "preliminary" "${quote_release_mode}" < scripts/stage-private-pricing-remote.sh

      - name: Remove private data from GitHub runner
        if: always()
        shell: bash
        run: |
          rm -rf -- "${RUNNER_TEMP}/pm-calc-private-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Configure Telegram order notifications
        shell: bash
        env:
          PM_TELEGRAM_BOT_TOKEN: ${{ secrets.PM_TELEGRAM_BOT_TOKEN }}
          PM_TELEGRAM_CHAT_ID: ${{ secrets.PM_TELEGRAM_CHAT_ID }}
          PM_GOOGLE_WEBHOOK_URL: ${{ secrets.PM_GOOGLE_WEBHOOK_URL }}
          PM_GOOGLE_SHARED_SECRET: ${{ secrets.PM_GOOGLE_SHARED_SECRET }}
        run: |
          if [ -z "${PM_TELEGRAM_BOT_TOKEN}" ] || [ -z "${PM_TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram production secrets are not configured." >&2
            exit 1
          fi
          if [ -n "${PM_GOOGLE_WEBHOOK_URL}" ] && [ -z "${PM_GOOGLE_SHARED_SECRET}" ]; then
            echo "PM_GOOGLE_SHARED_SECRET is required when PM_GOOGLE_WEBHOOK_URL is configured." >&2
            exit 1
          fi
          if [ -z "${PM_GOOGLE_WEBHOOK_URL}" ] && [ -n "${PM_GOOGLE_SHARED_SECRET}" ]; then
            echo "PM_GOOGLE_WEBHOOK_URL is required when PM_GOOGLE_SHARED_SECRET is configured." >&2
            exit 1
          fi

          telegram_api="https://api.telegram.org/bot${PM_TELEGRAM_BOT_TOKEN}"
          curl --fail --silent --show-error \
            "${telegram_api}/getMe" | jq --exit-status '.ok == true' >/dev/null
          curl --fail --silent --show-error \
            --data-urlencode "chat_id=${PM_TELEGRAM_CHAT_ID}" \
            "${telegram_api}/getChat" | jq --exit-status '.ok == true' >/dev/null

          config_file="$(mktemp)"
          remote_stage=".pechataet-maksim-orders-${GITHUB_RUN_ID}.php"
          trap 'rm -f "${config_file}"' EXIT

          CONFIG_FILE="${config_file}" node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';

          const quotePhp = (value) =>
            `'${value.replaceAll('\\', '\\\\').replaceAll("'", "\\'")}'`;
          const token = process.env.PM_TELEGRAM_BOT_TOKEN;
          const chatId = process.env.PM_TELEGRAM_CHAT_ID;
          const googleWebhookUrl = process.env.PM_GOOGLE_WEBHOOK_URL || '';
          const googleSharedSecret = process.env.PM_GOOGLE_SHARED_SECRET || '';

          writeFileSync(
            process.env.CONFIG_FILE,
            `<?php

          return [
              'telegram' => [
                  'bot_token' => ${quotePhp(token)},
                  'chat_id' => ${quotePhp(chatId)},
              ],
              'google' => [
                  'webhook_url' => ${quotePhp(googleWebhookUrl)},
                  'shared_secret' => ${quotePhp(googleSharedSecret)},
              ],
          ];
          `,
            { mode: 0o600 },
          );
          NODE

          scp -q -i ~/.ssh/deploy_key "${config_file}" \
            "${{ secrets.USERNAME }}@${{ secrets.HOST }}:${remote_stage}"
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.USERNAME }}@${{ secrets.HOST }}" \
            "set -eu; \
              install -d -m 700 '/var/www/u2767403/data/www/private'; \
              install -m 600 '${remote_stage}' \
                '/var/www/u2767403/data/www/private/pechataet-maksim-orders.php'; \
              rm -f '${remote_stage}'"

      - name: Upload site to REG.RU
        shell: bash
        run: |
          rsync -az --delete-delay --delay-updates \
            --exclude='.well-known/' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./_site/ "${{ secrets.USERNAME }}@${{ secrets.HOST }}:/var/www/u2767403/data/www/xn--80aaarctnodv3agc9d.xn--p1ai/"

      - name: Install notification worker cron
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.USERNAME }}@${{ secrets.HOST }}" \
            "set -eu; php_bin=\$(command -v php); \
             (crontab -l 2>/dev/null | grep -v 'notification-worker.php' || true; \
              echo \"* * * * * \${php_bin} /var/www/u2767403/data/www/xn--80aaarctnodv3agc9d.xn--p1ai/api/orders/notification-worker.php >> /var/www/u2767403/data/www/.pechataet-maksim-orders/worker.log 2>&1\") | crontab -"

      - name: Verify production version and routes
        shell: bash
        env:
          PRODUCTION_URL: https://xn--80aaarctnodv3agc9d.xn--p1ai
          PM_QUOTE_BETA_GO_SHA: ${{ vars.PM_QUOTE_BETA_GO_SHA }}
        run: |
          version_json="$(
            curl --fail --location \
              --retry 6 --retry-delay 5 --retry-all-errors \
              "${PRODUCTION_URL}/version.json?commit=${GITHUB_SHA}"
          )"
          deployed_sha="$(
            VERSION_JSON="${version_json}" node -e \
              "process.stdout.write(JSON.parse(process.env.VERSION_JSON).commit)"
          )"

          if [ "${deployed_sha}" != "${GITHUB_SHA}" ]; then
            echo "Expected ${GITHUB_SHA}, received ${deployed_sha}" >&2
            exit 1
          fi

          homepage_html="$(curl --fail --location --retry 3 "${PRODUCTION_URL}/")"
          grep -q '<title>Печать лент и наклеек с логотипом — Печатает Максим</title>' <<<"${homepage_html}"
          grep -q 'rel="canonical" href="https://xn--80aaarctnodv3agc9d.xn--p1ai/"' <<<"${homepage_html}"
          grep -q 'name="robots" content="index,follow,max-image-preview:large"' <<<"${homepage_html}"
          grep -q 'application/ld+json' <<<"${homepage_html}"

          curl --fail --location --retry 3 "${PRODUCTION_URL}/calc/" >/dev/null
          # Preliminary quote release: real public calculation, but NEVER an order.
          # No commercial unit costs or internal row data are logged.
          calc_catalog_json="$(
            curl --fail --silent --show-error --retry 3 \
              "${PRODUCTION_URL}/api/calc/"
          )"
          CALC_CATALOG_JSON="${calc_catalog_json}" node <<'PM_CATALOG_SMOKE'
          const response = JSON.parse(process.env.CALC_CATALOG_JSON);
          if (response.status !== 'catalog' || !Array.isArray(response.offers)
              || response.offers.length !== 124
              || new Set(response.offers.map(x => x.type)).size !== 2
              || !response.offers.every(x => Object.keys(x).sort().join(',') === 'base,geometry,print,type')
              || response.offers.some(x => x.type !== 'ribbon' && x.type !== 'sticker')) {
            throw new Error('Public preliminary catalog safety contract failed');
          }
          console.log('PASS: preliminary catalog exposed with public fields only');
          PM_CATALOG_SMOKE

          quote_json="$(
            curl --fail --silent --show-error --retry 3 \
              --header 'Content-Type: application/json' \
              --data-raw '{"orderItems":[{"itemId":"release-smoke","productType":"ribbon","quantity":{"meters":"5"},"configuration":{"widthMm":15,"repeatMm":100,"materialColor":"#f3eadc","printColor":"#171717"}}]}' \
              "${PRODUCTION_URL}/api/calc/"
          )"
          CALC_QUOTE_JSON="${quote_json}" node <<'PM_QUOTE_SMOKE'
          const response = JSON.parse(process.env.CALC_QUOTE_JSON);
          const number = Number(response.finalClientPrice);
          if (Object.keys(response).sort().join(',') !== 'canSubmitOrder,currency,finalClientPrice,status'
              || response.status !== 'estimate' || response.currency !== 'RUB'
              || response.canSubmitOrder !== false
              || !Number.isFinite(number) || number <= 0) {
            throw new Error('Public preliminary quote safety contract failed');
          }
          console.log('PASS: preliminary pricing returns final client total only; no order');
          PM_QUOTE_SMOKE

          # The linked quote endpoint is live only when this exact deploy SHA
          # was explicitly released. Verify issuance and resolution end-to-end
          # against the installed *private* Pricing 2 PHP engine, without
          # printing bearer tokens or private financial inputs.
          if [ -n "${PM_QUOTE_BETA_GO_SHA:-}" ] && [ "${PM_QUOTE_BETA_GO_SHA}" = "${GITHUB_SHA}" ]; then
            linked_issue="$(
              curl --fail --silent --show-error --retry 2 \
                --header 'Content-Type: application/json' \
                --data-raw '{"operation":"issue","orderItems":[{"itemId":"linked-release-smoke","productType":"ribbon","quantity":{"meters":"5"},"configuration":{"widthMm":15,"repeatMm":100,"materialColor":"#f3eadc","printColor":"#171717"}}]}' \
                "${PRODUCTION_URL}/api/calc/"
            )"
            linked_token="$(LINKED_ISSUE="${linked_issue}" node -e '
              const x=JSON.parse(process.env.LINKED_ISSUE);
              if(x.status!=="quote_issued"||x.canSubmitOrder!==false
                || !/^[a-f0-9]{48}$/.test(x.quoteId||"")
                || !Number.isFinite(Number(x.finalClientPrice))||Number(x.finalClientPrice)<=0
                || x.expiresAt<=Date.now()/1000) process.exit(2);
              process.stdout.write(x.quoteId);
            ')"
            linked_resolve="$(
              curl --fail --silent --show-error --retry 2 \
                --header 'Content-Type: application/json' \
                --data-raw "{\"operation\":\"resolve\",\"quoteId\":\"${linked_token}\"}" \
                "${PRODUCTION_URL}/api/calc/"
            )"
            LINKED_RESOLVE="${linked_resolve}" node -e '
              const x=JSON.parse(process.env.LINKED_RESOLVE);
              if(x.status!=="quote_resolved"||x.canSubmitOrder!==false
                || !Array.isArray(x.orderItems)||x.orderItems.length!==1
                || x.orderItems[0].itemId!=="linked-release-smoke"
                || !Number.isFinite(Number(x.finalClientPrice))||Number(x.finalClientPrice)<=0) process.exit(2);
              console.log("PASS: private-model-bound linked quote issue/resolve");
            '
          fi

          curl --fail --location --retry 3 "${PRODUCTION_URL}/studio/" >/dev/null
          curl --fail --location --retry 3 "${PRODUCTION_URL}/robots.txt" >/dev/null
          curl --fail --location --retry 3 "${PRODUCTION_URL}/sitemap.xml" >/dev/null

          order_api_status="$(
            curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' \
              "${PRODUCTION_URL}/api/orders/"
          )"
          if [ "${order_api_status}" != "405" ]; then
            echo "Order API is not executing PHP: HTTP ${order_api_status}" >&2
            exit 1
          fi

          canonical_host="xn--80aaarctnodv3agc9d.xn--p1ai"
          canonical_target="https://${canonical_host}/studio/?redirect-check=1"

          while read -r source expected_redirects; do
            initial_status="$(
              curl --silent --show-error \
                --output /dev/null \
                --write-out '%{http_code}' \
                "${source}/studio/?redirect-check=1"
            )"
            expected_status="301"
            if [ "${expected_redirects}" = "0" ]; then
              expected_status="200"
            fi

            if [ "${initial_status}" != "${expected_status}" ]; then
              echo "Unexpected initial status for ${source}: ${initial_status}" >&2
              exit 1
            fi

            result="$(
              curl --silent --show-error --location --max-redirs 8 \
                --output /dev/null \
                --write-out '%{http_code} %{url_effective} %{num_redirects}' \
                "${source}/studio/?redirect-check=1"
            )"
            read -r status effective_url redirects <<<"${result}"
            normalized_url="$(
              EFFECTIVE_URL="${effective_url}" node -e \
                "process.stdout.write(new URL(process.env.EFFECTIVE_URL).href)"
            )"

            if [ "${status} ${normalized_url} ${redirects}" != \
              "200 ${canonical_target} ${expected_redirects}" ]; then
              echo "Unexpected redirect for ${source}: ${result}" >&2
              exit 1
            fi
          done <<EOF
          http://${canonical_host} 1
          https://${canonical_host} 0
          http://www.${canonical_host} 1
          https://www.${canonical_host} 1
          http://print86.ru 1
          https://print86.ru 1
          http://www.print86.ru 1
          https://www.print86.ru 1
          EOF

          for legacy_path in \
            constructor.html \
            ribbon-studio-design-system-v1.html
          do
            legacy_html="$(
              curl --fail --location --retry 3 \
                "${PRODUCTION_URL}/${legacy_path}"
            )"
            if ! grep -q 'url=/studio/' <<<"${legacy_html}"; then
              echo "Legacy path /${legacy_path} does not redirect to /studio/" >&2
              exit 1
            fi
          done

          for private_path in \
            docs/PROJECT_CONTEXT.md \
            tests/studio-content.spec.js \
            private/pm-calc/SNAPSHOT_ASSORTMENT_PRIVATE.json
          do
            status="$(
              curl --location --silent --output /dev/null \
                --write-out '%{http_code}' \
                "${PRODUCTION_URL}/${private_path}"
            )"
            if [ "${status}" != "403" ] && [ "${status}" != "404" ]; then
              echo "Private path /${private_path} returned HTTP ${status}" >&2
              exit 1
            fi
          done
